name: Record fixtures

# Push to the "fixtures" branch (or run by hand) to refresh test/fixtures/recorded.json
# from the live NLM and openFDA APIs. The workflow commits the new file to that branch.
on:
  push:
    branches: [fixtures]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/record-fixtures.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fixtures/recorded.json
          git commit -m "Record API fixtures" || echo "No changes"
          git push
