name: probe
on: { push: { branches: [probe] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://rxnav.nlm.nih.gov/REST/ndcproperties.json?id=00378520905" \
            "https://rxnav.nlm.nih.gov/REST/rxcui/197361/properties.json" \
            "https://dailymed.nlm.nih.gov/dailymed/services/v2/spls/a4ab4f05-1c18-442a-8618-c2c92e589703/media.json" \
            "https://api.fda.gov/drug/enforcement.json?search=openfda.product_ndc:%220378-5209%22&limit=1" \
            "https://api.fda.gov/drug/ndc.json?search=product_ndc:%220378-5209%22&limit=1" \
            "https://rxnav.nlm.nih.gov/REST/approximateTerm.json?term=amlodipine%205&maxEntries=3" \
            "https://rxnav.nlm.nih.gov/REST/drugs.json?name=amlodipine" ; do
            echo "=== $u"; curl -s -D - -o /tmp/b -H "Origin: https://perezamadorluisenrique-gif.github.io" "$u" | grep -i -E "^(HTTP|access-control|content-type)"; head -c 600 /tmp/b; echo; done
          echo "=== preflight"; curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://x.github.io" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: accept" "https://rxnav.nlm.nih.gov/REST/rxcui/197361/properties.json" | grep -i -E "^(HTTP|access-control)"
