<title>Same Pill, New Look</title>
<meta name="description" content="Know before you open the bag. Same Pill, New Look tells you when a refill comes from a different manufacturer and will look different, so you can check with your pharmacist instead of skipping doses. In English and Spanish.">

<meta property="og:title" content="Same Pill, New Look">

    <p id="scanner-text"></p>
    <button class="secondary" id="scanner-close" type="button"></button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
